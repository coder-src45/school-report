[package]
name = "coder-src45/school-report"
version = "0.1.0"
description = "School Result Management System"
entrypoint = "run"

[dependencies]
"php/php" = "8.3.403"

[fs]
"/app" = "."
"/config" = "config"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app", "-S", "localhost:8080"]
env = ["PHPRC=/config/"]
